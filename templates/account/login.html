{% extends "allauth/layouts/base.html" %}
{% load socialaccount %}

{% block head_title %}Entrar - Lotofácil{% endblock %}

{% block body %}
  <h1>Entrar</h1>
  <p>Use sua conta Google para acessar suas análises e apostas.</p>
  <p>
    <a class="google-login-button" href="{% provider_login_url 'google' %}">
      <span class="google-mark">G</span> Entrar com Google
    </a>
  </p>
  <style>
    .google-login-button {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      background: #0b6e4f;
      font-weight: 700;
      text-decoration: none;
    }
    .google-login-button:hover { background: #095b42; }
  </style>
{% endblock %}
