name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ''
      DEBUG: 'False'
      SECRET_KEY: ci-only-secret

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar configuração Django
        run: python manage.py check

      - name: Executar testes
        run: python manage.py test

  deploy:
    name: Deploy no Render
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Configurar Go para instalar a Render CLI
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Instalar Render CLI
        run: |
          go install github.com/render-oss/cli@v2.22.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Disparar deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          render deploys create "$RENDER_SERVICE_ID" --wait --confirm
